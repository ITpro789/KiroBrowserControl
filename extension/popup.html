<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiro Browser Bridge</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font: 13px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
    width: 300px; margin: 0; padding: 14px;
  }
  h1 { font-size: 14px; margin: 0 0 10px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 10px 0; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #b9271f; flex: none; }
  .dot.on { background: #1f9254; }
  label { display: block; font-size: 11px; text-transform: uppercase;
          letter-spacing: .04em; opacity: .7; margin-bottom: 4px; }
  input[type=password], input[type=text] {
    width: 100%; box-sizing: border-box; padding: 6px 8px;
    font: 12px ui-monospace, Consolas, monospace;
    border: 1px solid #8884; border-radius: 4px; background: #8881;
  }
  button {
    font: 12px inherit; padding: 6px 10px; border-radius: 4px;
    border: 1px solid #8886; background: #8881; cursor: pointer;
  }
  button:hover { background: #8883; }
  .actions { display: flex; gap: 6px; margin-top: 10px; }
  .muted { font-size: 11px; opacity: .65; margin-top: 10px; }
  .warn { font-size: 11px; color: #b9271f; margin-top: 8px; display: none; }
</style>
</head>
<body>
  <h1>Kiro Browser Bridge</h1>

  <div class="row">
    <span class="dot" id="dot"></span>
    <span id="state">checking…</span>
  </div>

  <div>
    <label for="token">Bridge token</label>
    <input type="password" id="token" placeholder="paste token from setup" autocomplete="off">
  </div>

  <div class="actions">
    <button id="save">Save &amp; connect</button>
    <button id="detach">Detach all</button>
  </div>

  <div class="warn" id="warn"></div>

  <div class="muted">
    The token is printed by <code>bridge_server.py --server</code> on first run
    and stored in <code>.bridge-token</code>.
  </div>

  <script src="popup.js"></script>
</body>
</html>
