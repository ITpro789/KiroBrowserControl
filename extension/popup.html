<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiro-AG-Browser</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font: 13px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
    width: 300px; margin: 0; padding: 14px;
  }
  h1 { font-size: 14px; margin: 0 0 10px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 10px 0; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #b9271f; flex: none; }
  .dot.on { background: #1f9254; }
  label { display: block; font-size: 11px; text-transform: uppercase;
          letter-spacing: .04em; opacity: .7; margin-bottom: 4px; }
  input[type=password], input[type=text] {
    width: 100%; box-sizing: border-box; padding: 6px 8px;
    font: 12px ui-monospace, Consolas, monospace;
    border: 1px solid #8884; border-radius: 4px; background: #8881;
  }
  button {
    font: 12px inherit; padding: 6px 10px; border-radius: 4px;
    border: 1px solid #8886; background: #8881; cursor: pointer;
  }
  button:hover { background: #8883; }
  .actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .muted { font-size: 11px; opacity: .65; margin-top: 10px; }
  .warn { font-size: 11px; color: #b9271f; margin-top: 8px; display: none; }
  hr { border: 0; border-top: 1px solid #8883; margin: 14px 0 10px; }
  .check { display: flex; align-items: flex-start; gap: 7px; margin-top: 10px; }
  .check input { margin: 2px 0 0; flex: none; }
  .check span { font-size: 12px; }
</style>
</head>
<body>
  <h1>Kiro-AG-Browser</h1>

  <div class="row">
    <span class="dot" id="dot"></span>
    <span id="state">checking…</span>
  </div>

  <div>
    <label for="token">Bridge token</label>
    <input type="password" id="token" placeholder="paste token from setup" autocomplete="off">
  </div>

  <div class="actions">
    <button id="save">Save &amp; connect</button>
    <button id="detach">Detach all</button>
  </div>

  <div class="warn" id="warn"></div>

  <div class="muted">
    The token is printed by <code>bridge_server.py --server</code> on first run
    and stored in <code>.bridge-token</code>.
  </div>

  <hr>

  <label>Agent tabs</label>
  <div id="agentState" class="muted" style="margin-top:2px; white-space:pre-line">none yet</div>

  <div class="actions">
    <button id="show">Show Kiro tab</button>
    <button id="close">Close all</button>
  </div>

  <div class="check">
    <input type="checkbox" id="stealFocus">
    <span>
      <label for="stealFocus" style="text-transform:none;letter-spacing:0;opacity:1;font-size:12px;margin:0">
        Bring the tab to the front while working
      </label>
      <span class="muted" style="display:block;margin-top:2px">
        Off by default. The agent works in a background tab in the
        <strong>Kiro / AG</strong> group so you can keep browsing.
      </span>
    </span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
